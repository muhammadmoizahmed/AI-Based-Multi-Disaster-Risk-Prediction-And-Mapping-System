<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#F8FAFC">
    <meta name="robots" content="noindex">
    <title>You're Offline - DisasterGuard</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 24px;
            color: #34495E;
            background:
                radial-gradient(circle at 12% 8%, rgba(221, 235, 245, 0.9), transparent 36%),
                radial-gradient(circle at 88% 12%, rgba(255, 248, 238, 0.95), transparent 34%),
                linear-gradient(145deg, #F8FAFC, #F1F6F8);
            font-family: "Segoe UI", Inter, system-ui, -apple-system, sans-serif;
        }

        .offline-card {
            width: min(100%, 440px);
            padding: 40px 30px;
            text-align: center;
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid rgba(52, 73, 94, 0.08);
            border-radius: 28px;
            box-shadow: 0 24px 70px rgba(52, 73, 94, 0.12);
            backdrop-filter: blur(16px);
        }

        .offline-icon {
            width: 92px;
            height: 92px;
            margin: 0 auto 24px;
            border-radius: 26px;
            box-shadow: 0 16px 34px rgba(102, 142, 154, 0.28);
        }

        h1 {
            margin: 0 0 10px;
            font-size: clamp(1.55rem, 6vw, 2rem);
            letter-spacing: -0.04em;
        }

        p {
            margin: 0 auto 26px;
            max-width: 32ch;
            color: #7B8794;
            line-height: 1.7;
            font-size: 0.95rem;
        }

        .offline-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }

        a,
        button {
            min-height: 46px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0 20px;
            border-radius: 14px;
            border: 1px solid transparent;
            font: inherit;
            font-size: 0.9rem;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
        }

        .primary {
            color: #FFFFFF;
            background: #668E9A;
            box-shadow: 0 10px 24px rgba(102, 142, 154, 0.24);
        }

        .secondary {
            color: #4F6875;
            background: #FFFFFF;
            border-color: rgba(52, 73, 94, 0.12);
        }

        .offline-note {
            margin-top: 22px;
            margin-bottom: 0;
            font-size: 0.76rem;
            color: #9AA6B2;
        }
    </style>
</head>

<body>
    <main class="offline-card">
        <img class="offline-icon" src="/assets/icons/icon-192.png" alt="DisasterGuard">
        <h1>You're offline</h1>
        <p>DisasterGuard needs a connection for live weather, alerts, maps, and risk data. Your installed app is still
            ready to reconnect.</p>
        <div class="offline-actions">
            <button class="primary" type="button" onclick="location.reload()">Try again</button>
            <a class="secondary" href="/dashboard.html">Open dashboard</a>
        </div>
        <p class="offline-note">Cached app pages remain available. Live data will resume automatically.</p>
    </main>
    <script>
        window.addEventListener('online', function () {
            window.location.reload();
        });
    </script>
</body>

</html>
