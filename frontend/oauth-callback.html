<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>OAuth Callback - DisasterGuard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #34495E 0%, #EAF3FA 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
        }
        .container {
            text-align: center;
            padding: 40px;
            background: rgba(52, 73, 94, 0.07);
            border-radius: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(52, 73, 94, 0.10);
            max-width: 400px;
        }
        .spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(130, 170, 167, 0.30);
            border-top-color: #82AAA7;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        h2 {
            margin-bottom: 10px;
            color: #82AAA7;
        }
        p {
            color: #7B8794;
            margin-bottom: 20px;
        }
        .error {
            color: #D98282;
        }
        .success {
            color: #72B995;
        }
    </style>
    <script src="js/location.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/theme.css">
    <meta name="theme-color" content="#F8FAFC">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="DisasterGuard">
    <meta name="application-name" content="DisasterGuard">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">
</head>
<body>
    <div class="container">
        <div class="spinner"></div>
        <h2 id="status">Processing OAuth...</h2>
        <p id="message">Please wait while we complete your authentication.</p>
    </div>

    <script src="js/api-config.js"></script>
    <script src="js/main.js"></script>
    <script>
        async function handleCallback() {
            const urlParams = new URLSearchParams(window.location.search);
            const code = urlParams.get('code');
            const provider = urlParams.get('provider') || 'google';
            let error = urlParams.get('error');
            const success = urlParams.get('success');
            let email = urlParams.get('email');
            let name = urlParams.get('name');
            let token = urlParams.get('token');
            
            // Decode URL encoded parameters
            function decodeParam(param) {
                if (!param) return null;
                try {
                    return decodeURIComponent(param);
                } catch {
                    return param;
                }
            }
            
            email = decodeParam(email);
            name = decodeParam(name);
            error = decodeParam(error);
            token = decodeParam(token);

            const statusEl = document.getElementById('status');
            const messageEl = document.getElementById('message');

            if (error) {
                statusEl.textContent = 'Authentication Failed';
                statusEl.className = 'error';
                messageEl.textContent = 'Error: ' + error;
                setTimeout(() => {
                    window.location.href = './login.html';
                }, 3000);
                return;
            }

            // Handle direct redirect from backend with user data and token
            if (success === 'true' && email && name && token) {
                statusEl.textContent = 'Authentication Successful!';
                statusEl.className = 'success';
                messageEl.textContent = `Welcome, ${name}! Redirecting to dashboard...`;
                
                // Get role from URL params or default to user
                const role = urlParams.get('role') || 'user';
                
                // Store user info using AuthManager
                const userData = { email, name, role };
                AuthManager.setAuth(token, userData);

                setTimeout(() => {
                    // Redirect based on role
                    if (role === 'admin' || role === 'moderator') {
                        window.location.href = './admin/dashboard.html';
                    } else {
                        window.location.href = './dashboard.html';
                    }
                }, 1500);
                return;
            }

            // Handle OAuth flow with code
            if (!code) {
                statusEl.textContent = 'Invalid Request';
                statusEl.className = 'error';
                messageEl.textContent = 'No authorization code received.';
                setTimeout(() => {
                    window.location.href = './login.html';
                }, 3000);
                return;
            }

            try {
                // Call backend callback endpoint
                const response = await fetch(`/api/auth/${provider}/callback?code=${code}`, {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });

                const data = await response.json();

                if (data.success) {
                    statusEl.textContent = 'Authentication Successful!';
                    statusEl.className = 'success';
                    messageEl.textContent = `Welcome, ${data.user.name}! Redirecting to dashboard...`;
                    
                    // Store user info using AuthManager
                    AuthManager.setAuth(data.token, data.user);

                    const userRole = data.user?.role || 'user';
                    
                    setTimeout(() => {
                        // Redirect based on role
                        if (userRole === 'admin' || userRole === 'moderator') {
                            window.location.href = './admin/dashboard.html';
                        } else {
                            window.location.href = data.redirect || './dashboard.html';
                        }
                    }, 1500);
                } else {
                    statusEl.textContent = 'Authentication Failed';
                    statusEl.className = 'error';
                    messageEl.textContent = data.message || 'Authentication failed.';
                    setTimeout(() => {
                        window.location.href = './login.html';
                    }, 3000);
                }
            } catch (error) {
                statusEl.textContent = 'Connection Error';
                statusEl.className = 'error';
                messageEl.textContent = 'Failed to connect to the server.';
                console.error('OAuth callback error:', error);
                setTimeout(() => {
                    window.location.href = './login.html';
                }, 3000);
            }
        }

        // Handle callback on page load
        handleCallback();
    </script>
    <script src="js/mobile-nav.js"></script>
    <script src="./js/pwa.js"></script>
    <script src="./js/ui.js"></script>
</body>
</html>
