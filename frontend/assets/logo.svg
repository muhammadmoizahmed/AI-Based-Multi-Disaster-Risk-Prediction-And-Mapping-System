<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120">
  <!-- Background -->
  <rect width="400" height="120" fill="#0a0a0f" rx="10"/>
  
  <!-- Definitions for gradients -->
  <defs>
    <linearGradient id="shield3D" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0088aa;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#00d4ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00d4ff;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="darkSide" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#004455;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#006677;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Shield Icon - 3D style like main page -->
  <g transform="translate(25, 15)">
    <!-- Left/Dark side of shield (3D effect) -->
    <path d="M10 15 L40 5 L40 90 C40 90 10 70 10 50 Z" 
          fill="url(#darkSide)" stroke="none"/>
    <!-- Right/Cyan side of shield -->
    <path d="M40 5 L70 15 L70 50 C70 70 40 90 40 90 L40 5 Z" 
          fill="url(#shield3D)" stroke="none"/>
    <!-- Base/stand -->
    <rect x="35" y="88" width="10" height="8" fill="#00d4ff" rx="2"/>
  </g>
  
  <!-- Text: DisasterGuard -->
  <text x="110" y="55" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#ffffff">
    DisasterGuard
  </text>
  
  <!-- Subtitle -->
  <text x="110" y="85" font-family="Arial, sans-serif" font-size="14" fill="#00d4ff">
    Pakistan Disaster Prediction System
  </text>
  
  <!-- Decorative elements -->
  <circle cx="370" cy="30" r="3" fill="#00d4ff" opacity="0.5"/>
  <circle cx="380" cy="50" r="2" fill="#7b2cbf" opacity="0.5"/>
  <circle cx="375" cy="70" r="2.5" fill="#ff006e" opacity="0.5"/>
</svg>
