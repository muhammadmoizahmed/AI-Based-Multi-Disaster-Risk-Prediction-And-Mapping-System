<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - DisasterGuard</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="bg-mesh"></div>
    <div class="bg-grid"></div>

    <!-- Navigation -->
    <nav class="navbar">
        <div class="navbar-content">
            <a href="../index.html" class="logo">
                <i class="fas fa-shield-alt"></i>
                DisasterGuard
            </a>
            <a href="../login.html" class="btn btn-secondary">
                <i class="fas fa-user"></i> User Login
            </a>
        </div>
    </nav>

    <!-- Admin Login Form -->
    <div class="auth-page">
        <div class="auth-container">
            <div class="card-3d auth-card mirror-effect">
                <div class="auth-header">
                    <div style="width: 80px; height: 80px; background: linear-gradient(135deg, rgba(255, 23, 68, 0.2), rgba(255, 109, 0, 0.2)); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 1.5rem;">
                        <i class="fas fa-user-shield" style="font-size: 2.5rem; color: var(--accent-tertiary);"></i>
                    </div>
                    <h2 style="font-size: 1.75rem; font-weight: 800; margin-bottom: 0.5rem;">Admin Portal</h2>
                    <p style="color: var(--text-secondary);">System Administration Login</p>
                </div>

                <form id="adminLoginForm" class="auth-form">
                    <div class="input-group">
                        <i class="fas fa-user input-icon"></i>
                        <input type="text" class="input-field" id="adminUsername" placeholder="Admin Username" required>
                    </div>

                    <div class="input-group">
                        <i class="fas fa-lock input-icon"></i>
                        <input type="password" class="input-field" id="adminPassword" placeholder="Password" required>
                        <button type="button" class="password-toggle" onclick="togglePassword()">
                            <i class="fas fa-eye" id="toggleIcon"></i>
                        </button>
                    </div>

                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
                        <label style="display: flex; align-items: center; gap: 0.75rem; cursor: pointer; color: var(--text-secondary); font-size: 0.9rem;">
                            <input type="checkbox" id="rememberMe" style="width: 18px; height: 18px; cursor: pointer; accent-color: var(--accent-primary);">
                            <span>Remember me</span>
                        </label>
                        <a href="#" style="color: var(--accent-primary); font-size: 0.9rem; text-decoration: none;" onclick="showForgotPassword()">
                            Forgot Password?
                        </a>
                    </div>

                    <button type="submit" class="btn btn-primary" style="width: 100%;">
                        <i class="fas fa-sign-in-alt"></i> Login as Admin
                    </button>
                </form>

                <div style="text-align: center; margin-top: 1.5rem; padding-top: 1.5rem; border-top: 1px solid rgba(255, 255, 255, 0.1);">
                    <p style="color: var(--text-secondary); font-size: 0.9rem;">
                        <i class="fas fa-info-circle" style="color: var(--accent-primary); margin-right: 0.5rem;"></i>
                        Restricted Access - Authorized Personnel Only
                    </p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Toggle password visibility
        function togglePassword() {
            const passwordInput = document.getElementById('adminPassword');
            const toggleIcon = document.getElementById('toggleIcon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleIcon.classList.remove('fa-eye');
                toggleIcon.classList.add('fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                toggleIcon.classList.remove('fa-eye-slash');
                toggleIcon.classList.add('fa-eye');
            }
        }

        // Admin login form submission
        document.getElementById('adminLoginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const username = document.getElementById('adminUsername').value;
            const password = document.getElementById('adminPassword').value;
            const rememberMe = document.getElementById('rememberMe').checked;
            
            // Demo admin credentials (replace with real auth later)
            if (username === 'admin' && password === 'admin123') {
                // Store admin session
                localStorage.setItem('adminToken', 'demo_admin_token_' + Date.now());
                localStorage.setItem('adminUser', JSON.stringify({
                    username: username,
                    role: 'admin',
                    loginTime: new Date().toISOString()
                }));
                
                // Remember Me functionality
                if (rememberMe) {
                    localStorage.setItem('remember_me', 'true');
                    localStorage.setItem('saved_admin_username', username);
                    localStorage.setItem('saved_admin_password', password);
                } else {
                    localStorage.removeItem('remember_me');
                    localStorage.removeItem('saved_admin_username');
                    localStorage.removeItem('saved_admin_password');
                }
                // Redirect to admin dashboard
                window.location.href = 'dashboard.html';
            } else {
                alert('Invalid admin credentials!\n\nDemo credentials:\nUsername: admin\nPassword: admin123');
            }
        });

        // Load saved credentials if Remember Me was checked
        window.addEventListener('DOMContentLoaded', function() {
            const remember = localStorage.getItem('remember_me');
            if (remember === 'true') {
                document.getElementById('adminUsername').value = localStorage.getItem('saved_admin_username') || '';
                document.getElementById('adminPassword').value = localStorage.getItem('saved_admin_password') || '';
                document.getElementById('rememberMe').checked = true;
            }
        });

        // Check if already logged in
        if (localStorage.getItem('adminToken')) {
            window.location.href = 'dashboard.html';
        }

        function showForgotPassword() {
            alert('Please contact system administrator to reset admin password.');
        }
    </script>
</body>
</html>
