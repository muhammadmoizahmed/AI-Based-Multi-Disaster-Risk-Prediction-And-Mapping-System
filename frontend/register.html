<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - DisasterGuard</title>
    <link rel="stylesheet" href="css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Background Effects -->
    <div class="bg-mesh"></div>
    <div class="bg-grid"></div>

    <!-- Navigation -->
    <nav class="navbar">
        <div class="navbar-content">
            <a href="index.html" class="logo">
                <i class="fas fa-shield-alt"></i>
                DisasterGuard
            </a>
            <ul class="nav-links">
                <li><a href="index.html#features">Features</a></li>
                <li><a href="index.html#demo">Demo</a></li>
                <li><a href="login.html" class="btn btn-secondary">Sign In</a></li>
            </ul>
        </div>
    </nav>

    <!-- Auth Page -->
    <div class="auth-page">
        <div class="auth-container">
            <div class="card-3d auth-card">
                <div class="auth-header">
                    <div class="logo" style="justify-content: center; font-size: 2rem; margin-bottom: 1rem;">
                        <i class="fas fa-shield-alt"></i>
                    </div>
                    <h2>Create Account</h2>
                    <p>Join DisasterGuard and stay protected</p>
                </div>

                <!-- Social Login -->
                <div class="social-login">
                    <button class="social-btn" onclick="socialLogin('google')">
                        <i class="fab fa-google"></i>
                        Google
                    </button>
                    <button class="social-btn" onclick="socialLogin('github')">
                        <i class="fab fa-github"></i>
                        GitHub
                    </button>
                </div>

                <div class="divider">or register with email</div>

                <!-- Registration Form -->
                <form id="registerForm" onsubmit="handleRegister(event)">
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                        <div class="input-group">
                            <i class="fas fa-user input-icon"></i>
                            <input type="text" class="input-field" id="firstName" placeholder="First Name" required>
                        </div>
                        <div class="input-group">
                            <i class="fas fa-user input-icon"></i>
                            <input type="text" class="input-field" id="lastName" placeholder="Last Name" required>
                        </div>
                    </div>

                    <div class="input-group">
                        <i class="fas fa-envelope input-icon"></i>
                        <input type="email" class="input-field" id="email" placeholder="Enter your email" required>
                    </div>

                    <div class="input-group">
                        <i class="fas fa-phone input-icon"></i>
                        <input type="tel" class="input-field" id="phone" placeholder="Phone number (optional)">
                    </div>

                    <div class="input-group" style="position: relative;">
                        <i class="fas fa-lock input-icon"></i>
                        <input type="password" class="input-field" id="password" placeholder="Create password" required style="padding-right: 3rem;">
                        <i class="fas fa-eye toggle-password" onclick="togglePassword('password', this)" 
                           style="position: absolute; right: 1rem; top: 50%; transform: translateY(-50%); cursor: pointer; color: var(--text-muted);"></i>
                    </div>

                    <div class="input-group" style="position: relative;">
                        <i class="fas fa-lock input-icon"></i>
                        <input type="password" class="input-field" id="confirmPassword" placeholder="Confirm password" required style="padding-right: 3rem;">
                        <i class="fas fa-eye toggle-password" onclick="togglePassword('confirmPassword', this)" 
                           style="position: absolute; right: 1rem; top: 50%; transform: translateY(-50%); cursor: pointer; color: var(--text-muted);"></i>
                    </div>

                    <div style="margin-bottom: 1.5rem;">
                        <label style="display: flex; align-items: flex-start; gap: 0.75rem; cursor: pointer; font-size: 0.9rem; color: var(--text-secondary);">
                            <input type="checkbox" id="terms" required style="margin-top: 0.25rem;">
                            <span>I agree to the <a href="terms.html" target="_blank" style="color: var(--accent-primary);">Terms of Service</a> and <a href="privacy.html" target="_blank" style="color: var(--accent-primary);">Privacy Policy</a></span>
                        </label>
                    </div>

                    <button type="submit" class="btn btn-primary" style="width: 100%; padding: 1rem;">
                        <i class="fas fa-user-plus"></i>
                        Create Account
                    </button>
                </form>

                <div class="auth-footer">
                    <p>Already have an account? <a href="login.html">Sign in</a></p>
                </div>
            </div>
        </div>
    </div>

    <!-- PIN Verification Modal -->
    <div id="verifyModal" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 10000; align-items: center; justify-content: center;">
        <div class="card-3d" style="max-width: 400px; padding: 2rem; text-align: center;">
            <div style="width: 70px; height: 70px; background: linear-gradient(135deg, rgba(0, 212, 255, 0.2), rgba(123, 47, 247, 0.2)); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 1.5rem;">
                <i class="fas fa-lock" style="font-size: 2rem; color: var(--accent-primary);"></i>
            </div>
            <h3 style="font-size: 1.5rem; margin-bottom: 0.5rem;">Enter Verification PIN</h3>
            <p style="color: var(--text-secondary); margin-bottom: 1.5rem; font-size: 0.9rem;">
                We've sent a 6-digit PIN to <strong id="verifyEmail" style="color: var(--accent-primary);"></strong>
            </p>
            <div style="display: flex; gap: 0.5rem; justify-content: center; margin-bottom: 1.5rem;">
                <input type="text" id="pin1" maxlength="1" class="input-field" style="width: 45px; height: 55px; text-align: center; font-size: 1.5rem; letter-spacing: 5px;" oninput="moveToNext(this, 'pin2')" onkeyup="moveBack(event, 'pin1', this)">
                <input type="text" id="pin2" maxlength="1" class="input-field" style="width: 45px; height: 55px; text-align: center; font-size: 1.5rem; letter-spacing: 5px;" oninput="moveToNext(this, 'pin3')" onkeyup="moveBack(event, 'pin1', this)">
                <input type="text" id="pin3" maxlength="1" class="input-field" style="width: 45px; height: 55px; text-align: center; font-size: 1.5rem; letter-spacing: 5px;" oninput="moveToNext(this, 'pin4')" onkeyup="moveBack(event, 'pin2', this)">
                <input type="text" id="pin4" maxlength="1" class="input-field" style="width: 45px; height: 55px; text-align: center; font-size: 1.5rem; letter-spacing: 5px;" oninput="moveToNext(this, 'pin5')" onkeyup="moveBack(event, 'pin3', this)">
                <input type="text" id="pin5" maxlength="1" class="input-field" style="width: 45px; height: 55px; text-align: center; font-size: 1.5rem; letter-spacing: 5px;" oninput="moveToNext(this, 'pin6')" onkeyup="moveBack(event, 'pin4', this)">
                <input type="text" id="pin6" maxlength="1" class="input-field" style="width: 45px; height: 55px; text-align: center; font-size: 1.5rem; letter-spacing: 5px;" onkeyup="moveBack(event, 'pin5', this)">
            </div>
            <button class="btn btn-primary" style="width: 100%; margin-bottom: 1rem;" onclick="verifyPIN()">
                <i class="fas fa-check"></i> Verify
            </button>
            <div style="display: flex; gap: 1rem; justify-content: center;">
                <button class="btn btn-secondary" onclick="resendPIN()" style="font-size: 0.85rem;">
                    <i class="fas fa-redo"></i> Resend PIN
                </button>
            </div>
            <p style="margin-top: 1rem; color: var(--text-muted); font-size: 0.8rem;">
                PIN valid for 10 minutes
            </p>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" style="position: fixed; bottom: 2rem; right: 2rem; background: var(--bg-card); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: var(--radius-md); padding: 1rem 1.5rem; display: none; align-items: center; gap: 0.75rem; z-index: 9999; box-shadow: var(--shadow-3d);">
        <i id="toastIcon" class="fas fa-info-circle" style="color: var(--accent-primary);"></i>
        <span id="toastMessage">Notification</span>
    </div>

    <script src="js/main.js"></script>
    <script>
        // Toggle password visibility
        function togglePassword(inputId, icon) {
            const input = document.getElementById(inputId);
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }

        let pendingEmail = '';
        
        function handleRegister(e) {
            e.preventDefault();
            
            const firstName = document.getElementById('firstName').value;
            const lastName = document.getElementById('lastName').value;
            const email = document.getElementById('email').value;
            const phone = document.getElementById('phone').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const terms = document.getElementById('terms').checked;
            
            if (!terms) {
                showToast('Please accept the Terms of Service', 'error');
                return;
            }
            
            if (password !== confirmPassword) {
                showToast('Passwords do not match', 'error');
                return;
            }
            
            if (password.length < 8) {
                showToast('Password must be at least 8 characters', 'error');
                return;
            }
            
            showToast('Sending verification PIN...', 'info');
            
            // Call API to send PIN
            fetch('http://localhost:5000/api/auth/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name: firstName + ' ' + lastName, email, password })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    localStorage.setItem('pending_email', email);
                    showToast('PIN sent! Redirecting...', 'success');
                    setTimeout(() => {
                        window.location.href = 'verify-email.html';
                    }, 1500);
                } else {
                    showToast(data.message || 'Failed to send PIN', 'error');
                }
            })
            .catch(err => {
                console.error(err);
                showToast('Server error. Make sure backend is running.', 'error');
            });
        }
        
        function verifyPIN() {
            const pin = document.getElementById('pin1').value + 
                       document.getElementById('pin2').value + 
                       document.getElementById('pin3').value + 
                       document.getElementById('pin4').value + 
                       document.getElementById('pin5').value + 
                       document.getElementById('pin6').value;
            
            if (pin.length !== 6) {
                showToast('Please enter complete 6-digit PIN', 'error');
                return;
            }
            
            fetch('http://localhost:5000/api/auth/verify-pin', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: pendingEmail, password: pin })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    showToast('Email verified successfully!', 'success');
                    document.getElementById('verifyModal').style.display = 'none';
                    setTimeout(() => window.location.href = 'login.html', 1500);
                } else {
                    showToast(data.message || 'Invalid PIN', 'error');
                    clearPINInputs();
                }
            })
            .catch(err => {
                showToast('Verification failed', 'error');
            });
        }
        
        function resendPIN() {
            fetch('http://localhost:5000/api/auth/resend-pin', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: pendingEmail })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    showToast('New PIN sent!', 'success');
                    clearPINInputs();
                } else {
                    showToast(data.message || 'Failed to resend PIN', 'error');
                }
            });
        }
        
        function clearPINInputs() {
            for (let i = 1; i <= 6; i++) {
                document.getElementById('pin' + i).value = '';
            }
            document.getElementById('pin1').focus();
        }
        
        function moveToNext(current, nextId) {
            if (current.value.length === 1) {
                document.getElementById(nextId).focus();
            }
        }
        
        function moveBack(event, prevId, current) {
            if (event.key === 'Backspace' && current.value === '') {
                document.getElementById(prevId).focus();
            }
        }

        async function socialLogin(provider) {
            if (provider === 'google') {
                try {
                    const response = await fetch('http://localhost:5000/api/auth/google');
                    const data = await response.json();
                    
                    if (data.auth_url) {
                        window.location.href = data.auth_url;
                    } else {
                        showToast(data.message || 'Google OAuth not configured', 'error');
                    }
                } catch (error) {
                    console.error('Google login error:', error);
                    showToast('Failed to connect to Google. Make sure backend is running.', 'error');
                }
            } else if (provider === 'github') {
                try {
                    const response = await fetch('http://localhost:5000/api/auth/github');
                    const data = await response.json();
                    
                    if (data.auth_url) {
                        window.location.href = data.auth_url;
                    } else {
                        showToast(data.message || 'GitHub OAuth not configured', 'error');
                    }
                } catch (error) {
                    console.error('GitHub login error:', error);
                    showToast('Failed to connect to GitHub. Make sure backend is running.', 'error');
                }
            }
        }

        function resendEmail() {
            showToast('Verification email resent!', 'success');
        }

        function showToast(message, type = 'info') {
            const toast = document.getElementById('toast');
            const toastIcon = document.getElementById('toastIcon');
            const toastMessage = document.getElementById('toastMessage');
            
            toastMessage.textContent = message;
            
            const icons = {
                success: 'fa-check-circle',
                error: 'fa-exclamation-circle',
                info: 'fa-info-circle'
            };
            
            const colors = {
                success: 'var(--risk-low)',
                error: 'var(--risk-extreme)',
                info: 'var(--accent-primary)'
            };
            
            toastIcon.className = `fas ${icons[type]}`;
            toastIcon.style.color = colors[type];
            
            toast.style.display = 'flex';
            
            setTimeout(() => {
                toast.style.display = 'none';
            }, 3000);
        }
    </script>
</body>
</html>
