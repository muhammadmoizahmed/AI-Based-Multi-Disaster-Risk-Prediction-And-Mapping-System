<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - DisasterGuard</title>
    <link rel="stylesheet" href="css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <!-- Background Effects -->
    <div class="bg-mesh"></div>
    <div class="bg-grid"></div>

    <!-- Navigation -->
    <nav class="navbar">
        <div class="navbar-content">
            <a href="index.html" class="logo">
                <i class="fas fa-shield-alt"></i>
                DisasterGuard
            </a>
            <ul class="nav-links">
                <li><a href="index.html#features">Features</a></li>
                <li><a href="index.html#demo">Demo</a></li>
                <li><a href="register.html" class="btn btn-primary">Sign Up</a></li>
            </ul>
        </div>
    </nav>

    <!-- Auth Page -->
    <div class="auth-page">
        <div class="auth-container">
            <div class="card-3d auth-card">
                <div class="auth-header">
                    <div class="logo" style="justify-content: center; font-size: 2rem; margin-bottom: 1rem;">
                        <i class="fas fa-shield-alt"></i>
                    </div>
                    <h2>Welcome Back</h2>
                    <p>Sign in to access your disaster monitoring dashboard</p>
                </div>

                <!-- Social Login -->
                <div class="social-login">
                    <button class="social-btn" onclick="socialLogin('google')">
                        <i class="fab fa-google"></i>
                        Sign In With Google
                    </button>
                    <!-- <button class="social-btn" onclick="socialLogin('github')">
                        <i class="fab fa-github"></i>
                        GitHub
                    </button> -->
                </div>

                <div class="divider">or continue with email</div>

                <!-- Login Form -->
                <form id="loginForm" onsubmit="handleLogin(event)">
                    <div class="input-group">
                        <i class="fas fa-envelope input-icon"></i>
                        <input type="email" class="input-field" id="email" placeholder="Enter your email" required>
                    </div>

                    <div class="input-group" style="position: relative;">
                        <i class="fas fa-lock input-icon"></i>
                        <input type="password" class="input-field" id="password" placeholder="Enter your password"
                            required style="padding-right: 3rem;">
                        <i class="fas fa-eye toggle-password" onclick="togglePassword('password', this)" 
                           style="position: absolute; right: 1rem; top: 50%; transform: translateY(-50%); cursor: pointer; color: var(--text-muted);"></i>
                    </div>

                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
                        <label style="display: flex; align-items: center; gap: 0.75rem; cursor: pointer; color: var(--text-secondary); font-size: 0.9rem;">
                            <input type="checkbox" id="rememberMe" style="width: 18px; height: 18px; cursor: pointer; accent-color: var(--accent-primary);">
                            <span>Remember me</span>
                        </label>
                        <a href="forgot-password.html"
                            style="color: var(--accent-primary); text-decoration: none; font-size: 0.9rem;">
                            Forgot password?
                        </a>
                    </div>

                    <button type="submit" class="btn btn-primary" style="width: 100%; padding: 1rem;">
                        <i class="fas fa-sign-in-alt"></i>
                        Sign In
                    </button>
                </form>

                <div class="auth-footer">
                    <p>Don't have an account? <a href="register.html">Create one</a></p>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast"
        style="position: fixed; bottom: 2rem; right: 2rem; background: var(--bg-card); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: var(--radius-md); padding: 1rem 1.5rem; display: none; align-items: center; gap: 0.75rem; z-index: 9999; box-shadow: var(--shadow-3d);">
        <i id="toastIcon" class="fas fa-info-circle" style="color: var(--accent-primary);"></i>
        <span id="toastMessage">Notification</span>
    </div>

    <script src="js/main.js"></script>
    <script>
        // Toggle password visibility
        function togglePassword(inputId, icon) {
            const input = document.getElementById(inputId);
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }

        // Load saved credentials if Remember Me was checked
        window.addEventListener('DOMContentLoaded', function() {
            const savedEmail = localStorage.getItem('saved_email');
            const savedPassword = localStorage.getItem('saved_password');
            const rememberMe = localStorage.getItem('remember_me') === 'true';
            
            if (rememberMe && savedEmail) {
                document.getElementById('email').value = savedEmail;
                document.getElementById('password').value = savedPassword;
                document.getElementById('rememberMe').checked = true;
            }
        });

        async function handleLogin(e) {
            e.preventDefault();

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const rememberMe = document.getElementById('rememberMe').checked;

            try {
                // Call backend login API
                const response = await fetch('http://localhost:5001/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        email: email,
                        password: password
                    })
                });

                const data = await response.json();

                if (data.success) {
                    showToast('Login successful! Redirecting...', 'success');

                    // Store auth state using AuthManager
                    AuthManager.setAuth(data.token, data.user);
                    
                    // Remember Me functionality
                    if (rememberMe) {
                        localStorage.setItem('remember_me', 'true');
                        localStorage.setItem('saved_email', email);
                        localStorage.setItem('saved_password', password);
                    } else {
                        localStorage.setItem('remember_me', 'false');
                        localStorage.removeItem('saved_email');
                        localStorage.removeItem('saved_password');
                    }

                    // USER LOGIN ONLY: ALWAYS GO TO USER DASHBOARD
                    setTimeout(() => {
                        window.location.href = 'dashboard.html';
                    }, 1500);
                } else {
                    showToast(data.message || 'Login failed!', 'error');
                }
            } catch (error) {
                console.error('Login error:', error);
                showToast('Error during login! Please try again.', 'error');
            }
        }

        async function socialLogin(provider) {
            if (provider === 'google') {
                try {
                    const response = await fetch('http://localhost:5001/api/auth/google');
                    const data = await response.json();

                    if (data.auth_url) {
                        window.location.href = data.auth_url;
                    } else {
                        showToast(data.message || 'Google OAuth not configured', 'error');
                    }
                } catch (error) {
                    console.error('Google login error:', error);
                    showToast('Failed to connect to Google. Make sure backend is running.', 'error');
                }
            } else if (provider === 'github') {
                try {
                    const response = await fetch('http://localhost:5001/api/auth/github');
                    const data = await response.json();

                    if (data.auth_url) {
                        window.location.href = data.auth_url;
                    } else {
                        showToast(data.message || 'GitHub OAuth not configured', 'error');
                    }
                } catch (error) {
                    console.error('GitHub login error:', error);
                    showToast('Failed to connect to GitHub. Make sure backend is running.', 'error');
                }
            }
        }

        function showToast(message, type = 'info') {
            const toast = document.getElementById('toast');
            const toastIcon = document.getElementById('toastIcon');
            const toastMessage = document.getElementById('toastMessage');

            toastMessage.textContent = message;

            const icons = {
                success: 'fa-check-circle',
                error: 'fa-exclamation-circle',
                info: 'fa-info-circle'
            };

            const colors = {
                success: 'var(--risk-low)',
                error: 'var(--risk-extreme)',
                info: 'var(--accent-primary)'
            };

            toastIcon.className = `fas ${icons[type]}`;
            toastIcon.style.color = colors[type];

            toast.style.display = 'flex';

            setTimeout(() => {
                toast.style.display = 'none';
            }, 3000);
        }

        // Check if already logged in - DISABLED FOR PREVIEW
        // document.addEventListener('DOMContentLoaded', () => {
        //     const token = localStorage.getItem('auth_token');
        //     if (token) {
        //         window.location.href = 'dashboard.html';
        //     }
        // });
    </script>
</body>

</html>
